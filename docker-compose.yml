services:
  age-gender-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      MODEL_NAME: audeering/wav2vec2-large-robust-24-ft-age-gender
      MODEL_DEVICE: cpu
      MODEL_LOCAL_FILES_ONLY: "false"
      HF_HOME: /cache/huggingface
      API_PREFIX: /api/v1
      CORS_ORIGINS: "*"
    volumes:
      # Persist / reuse Hugging Face model cache across restarts
      - hf_cache:/cache/huggingface
      # Optional: mount host cache already present on this machine
      # - /data/huggingface:/cache/huggingface:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

volumes:
  hf_cache:
